fragment_schema = "https://vibelang.org/schemas/public-api-semantic-fragment/v1"
fragment_version = 1
domain = "runtime"

[[records]]
target_id = "v1:operation:27b207db1a90d637"
owner = "vibelang-core"

[records.operation]
kind = "mutation"
idempotency = "conditional"
consistency = "response_snapshot"
effect_timing = "runtime_queued"
atomicity = "best_effort"

[[records]]
target_id = "v1:operation:ca4641c620621c16"
owner = "vibelang-core"

[records.operation]
kind = "mutation"
idempotency = "conditional"
consistency = "response_snapshot"
effect_timing = "immediate_live"
atomicity = "required"

[records.revision]
mode = "allocates"
acceptance = ["rejected", "accepted", "terminal"]
terminals = ["rejected", "superseded", "applied", "partial"]

[records.receipt]
attempt_id_type = "AttemptId"
runtime_epoch_type = "RuntimeEpoch"
revision_id_type = "RevisionId"
event_sequence_type = "EventSequence"
terminal_outcomes = ["rejected", "superseded", "applied", "partial"]
component_outcomes = ["applied", "failed", "uncertain", "not_started"]

[records.failure]
stages = ["decode", "validate", "admission", "observe"]
error_ids = [
    "mutation.error.counter_exhausted",
    "mutation.error.digest",
    "mutation.error.duplicate_idempotency_key",
    "mutation.error.embedded_external_effect",
    "mutation.error.internal_source_forbidden",
    "mutation.error.invalid_idempotency_key",
    "mutation.error.invalid_operation",
    "mutation.error.invalid_receipt",
    "mutation.error.invalid_transition",
    "mutation.error.missing_caller_namespace",
    "mutation.error.missing_idempotency_key",
    "mutation.error.mixed_required_atomic_submission",
    "mutation.error.not_a_candidate",
    "mutation.error.receipt_not_found",
    "mutation.error.revision_order",
]
retryable = false
prior_state = "unchanged"
fallback = "reject"
panic_exposure = "none"
delivery = ["return", "receipt", "event"]
cleanup_owner = "vibelang-core"

[[records.effects]]
id = "v1:effect:0c2d335505bbdaeb"
kind = "start"
target_id = "v1:type:6e969465cb81c53b"
behavior = "external"
observable_result = "one separately keyed top-level receipt per external effect, ordered by submission, carrying a domain-scoped wire kind"
preconditions = [
    "the caller issues a distinct idempotency key for every external effect",
    "the external effect is its own top-level submission and rides inside no Candidate submission under either atomicity",
]

[[records.effects]]
id = "v1:effect:287f24a9d934f2e1"
kind = "register"
target_id = "v1:type:e6937d2924671d09"
behavior = "add"
observable_result = "one canonical attempt receipt and ordered transition event"
preconditions = ["the submitted runtime epoch and idempotency identity are valid"]

[[records.effects]]
id = "v1:effect:7b38f7cd88aae451"
kind = "register"
target_id = "v1:type:c44bc4e24b5d0114"
behavior = "add"
observable_result = "a finished recording run completes into exactly one typed sample reference"
preconditions = ["at most one recording run is active when the owning evaluation finishes"]
