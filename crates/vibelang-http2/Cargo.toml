[package]
name = "vibelang-http2"
version = "0.1.0"
edition = "2021"
description = "HTTP REST API server for VibeLang (core2 backend)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/trusch/vibelang"
keywords = ["music", "audio", "rest-api", "websocket"]
categories = ["multimedia::audio", "web-programming"]

[features]
default = ["native", "midi"]
native = ["vibelang-core2/native"]
midi = ["vibelang-core2/midi"]

[dependencies]
# Core runtime (core2)
vibelang-core2 = { path = "../vibelang-core2", default-features = false }

# HTTP framework
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }

# Async runtime
tokio = { version = "1", features = ["sync", "time"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"

# UUID for resource IDs
uuid = { version = "1.0", features = ["v4"] }
