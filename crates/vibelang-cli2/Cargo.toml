[package]
name = "vibelang-cli2"
version = "0.2.0"
edition = "2021"
description = "CLI binary for VibeLang using the new core2 runtime"
license = "MIT OR Apache-2.0"
repository = "https://github.com/trusch/vibelang"
keywords = ["music", "audio", "supercollider", "livecoding", "dsl"]
categories = ["multimedia::audio", "command-line-utilities"]

[[bin]]
name = "vibe2"
path = "src/main.rs"

[features]
default = ["midi", "api", "lsp"]
midi = ["vibelang-core2/midi", "vibelang-rhai/midi", "dep:midir"]
api = ["dep:vibelang-http2"]
lsp = ["dep:vibelang-lsp2"]

[dependencies]
# Core runtime (new async architecture)
vibelang-core2 = { path = "../vibelang-core2", features = ["native"] }
vibelang-rhai = { path = "../vibelang-rhai" }
vibelang-dsp = { path = "../vibelang-dsp" }

# LSP server (new core2-based)
vibelang-lsp2 = { path = "../vibelang-lsp2", optional = true }

# HTTP REST API server
vibelang-http2 = { path = "../vibelang-http2", optional = true }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Error handling
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }

# File watching
notify = "6"

# OSC for scsynth communication
rosc = "0.11"

# Signal handling
ctrlc = "3.4"

# TUI
ratatui = "0.30"
crossterm = "0.29"
chrono = "0.4"

# Clipboard (for MIDI recording export)
arboard = "3.4"

# OS-level keyboard input (for virtual keyboard key release detection)
rdev = "0.5"

# Render command
tempfile = "3.10"
which = "8"
tar = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
midir = { version = "0.10", optional = true }
