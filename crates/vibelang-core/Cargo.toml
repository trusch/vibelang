[package]
name = "vibelang-core"
version = "0.4.0"
edition = "2021"
description = "Clean, trait-based runtime for VibeLang - generic over synthesis backends"
license = "MIT OR Apache-2.0"
repository = "https://github.com/trusch/vibelang"

[features]
default = ["native", "midi"]
native = ["rosc"]
midi = ["dep:midir", "pipewire-midi2"]
pipewire-midi2 = ["dep:libspa", "dep:pipewire"]

[dependencies]
async-trait = "0.1"
thiserror = "1"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
vibelang-dsp = "0.4.0"
vibelang-sfz = "0.4.0"
parking_lot = "0.12"
crossbeam-channel = "0.5"
futures = "0.3"
getrandom = { workspace = true }
hmac = "0.12"
humantime = "2.1"
serde_jcs = "0.1"
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
uuid = { version = "1.0", features = ["serde", "v7"] }

[package.metadata.vibelang.api-contract]
wire-source = "src/mutation/wire.rs"
ledger-source = "src/mutation/ledger.rs"
runtime-fragment = "../../api/contract/runtime.toml"
wire-schema-version = 1

[dev-dependencies]
tokio = { version = "1", features = ["sync", "rt", "time", "macros", "rt-multi-thread"] }
tracing-subscriber = "0.3"
rhai = { version = "1", features = ["serde"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }
tokio-util = "0.7"
rosc = { version = "0.10", optional = true }
midir = { version = "0.9", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(all(unix, not(target_arch = "wasm32")))'.dependencies]
libspa = { version = "0.9", optional = true }
pipewire = { version = "0.9", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-time = "1.1"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }
