[package]
name = "vibelang-lsp"
version = "0.4.0"
edition = "2021"
description = "Language Server Protocol implementation for VibeLang"
license = "MIT OR Apache-2.0"
repository = "https://github.com/trusch/vibelang"
keywords = ["music", "audio", "lsp", "language-server"]
categories = ["development-tools"]

[dependencies]
# Core runtime (for validation)
vibelang-core = { version = "0.4.0", default-features = false, features = ["native"] }

# Rhai scripting layer
vibelang-rhai = { version = "0.4.0", default-features = false, features = ["native"] }

# Rhai engine (for error types)
rhai = { version = "1", features = ["sync"] }

# DSP for UGen manifests and synthdef validation
vibelang-dsp = "0.4.0"

# Standard library (for stdlib path)
vibelang-std = "0.4.0"

# LSP server
tower-lsp = "0.20"
async-trait = "0.1"

# Document management
ropey = "1.6"
dashmap = "6"
regex = "1"

# Async runtime
tokio = { version = "1", features = ["io-std", "sync", "rt-multi-thread"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"

[features]
default = []

# Script extensions (disabled by default for LSP - validation shouldn't have side effects)
# These can be enabled if the LSP needs to validate scripts that use extensions
extensions = ["ext-fs", "ext-exec", "ext-net"]
ext-fs = ["vibelang-rhai/ext-fs"]
ext-exec = ["vibelang-rhai/ext-exec"]
ext-net = ["vibelang-rhai/ext-net"]
