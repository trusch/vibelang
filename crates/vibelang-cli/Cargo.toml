[package]
name = "vibelang-cli"
version = "0.4.0"
edition = "2021"
description = "CLI binary for VibeLang"
license = "MIT OR Apache-2.0"
repository = "https://github.com/trusch/vibelang"
keywords = ["music", "audio", "supercollider", "livecoding", "dsl"]
categories = ["multimedia::audio", "command-line-utilities"]

[[bin]]
name = "vibe"
path = "src/main.rs"

[features]
default = ["midi", "api", "lsp", "extensions"]
midi = ["vibelang-core/midi", "vibelang-rhai/midi", "dep:midir"]
api = ["dep:vibelang-http"]
lsp = ["dep:vibelang-lsp"]

# Script extensions (filesystem, exec, networking)
extensions = ["ext-fs", "ext-exec", "ext-net"]
ext-fs = ["vibelang-rhai/ext-fs"]
ext-exec = ["vibelang-rhai/ext-exec"]
ext-net = ["vibelang-rhai/ext-net"]

[dependencies]
# Core runtime
vibelang-core = { version = "0.4.0", features = ["native"] }
vibelang-rhai = "0.4.0"
vibelang-dsp = "0.4.0"
vibelang-std = "0.4.0"

# LSP server
vibelang-lsp = { version = "0.4.0", optional = true }

# HTTP REST API server
vibelang-http = { version = "0.4.0", optional = true }

# Rhai engine — needed for the MIDI dispatcher to call Rhai FnPtrs
rhai = { version = "1", features = ["sync"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Error handling
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }

# File watching
notify = "6"

# OSC for scsynth communication
rosc = "0.11"

# Signal handling
ctrlc = "3.4"

# TUI
ratatui = "0.30"
crossterm = "0.29"
chrono = "0.4"

# Clipboard (for MIDI recording export)
arboard = "3.4"

# OS-level keyboard input (for virtual keyboard key release detection)
rdev = "0.5"

# Render command
tempfile = "3.10"
which = "8"
tar = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
midir = { version = "0.10", optional = true }
