[package]
name = "vibelang-http"
version = "0.4.0"
edition = "2021"
description = "HTTP REST API server for VibeLang"
license = "MIT OR Apache-2.0"
repository = "https://github.com/trusch/vibelang"
keywords = ["music", "audio", "rest-api", "websocket"]
categories = ["multimedia::audio", "web-programming"]

[features]
default = ["native", "midi"]
native = ["vibelang-core/native"]
midi = ["vibelang-core/midi", "dep:midir"]

[dependencies]
# Core runtime
vibelang-core = { version = "0.4.0", default-features = false }

# Canonical note-name parsing (already in the dependency graph via core)
vibelang-dsp = "0.4.0"

# HTTP framework
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }

# Async runtime
tokio = { version = "1", features = ["sync", "time"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"

# UUID for resource IDs
uuid = { version = "1.0", features = ["v4"] }

# MIDI (optional, for MIDI API endpoints)
midir = { version = "0.9", optional = true }
