[package]
name = "vibelang-rhai"
version = "0.1.0"
edition = "2021"
description = "Rhai scripting layer for VibeLang - provides the .vibe scripting API"
license = "MIT"

[features]
default = ["native", "midi"]
native = ["vibelang-core2/native"]
midi = ["vibelang-core2/midi", "dep:midir"]

# Optional extensions (opt-in for additional capabilities)
# These provide powerful features but should only be enabled in trusted environments

# Enable all extensions
extensions = ["ext-fs", "ext-exec", "ext-net"]

# Filesystem extension (read_file, write_file, etc.)
ext-fs = []

# Shell command execution extension
ext-exec = []

# Networking extension (HTTP client)
ext-net = []

[dependencies]
vibelang-core2 = { path = "../vibelang-core2", default-features = false }
vibelang-dsp = { path = "../vibelang-dsp" }
rhai = { version = "1", features = ["sync"] }
tracing = "0.1"
log = "0.4"
thiserror = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
midir = { version = "0.10", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
# Enable wasm_js feature for getrandom used by ahash/rhai
getrandom = { version = "0.3", features = ["wasm_js"] }
# Stdlib for in-memory module resolution in WASM
vibelang-std = { path = "../vibelang-std" }
