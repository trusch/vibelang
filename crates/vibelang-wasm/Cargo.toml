[package]
name = "vibelang-wasm"
version = "0.4.0"
edition = "2021"
description = "WASM bindings for VibeLang - browser-based music programming"
license = "MIT OR Apache-2.0"
repository = "https://github.com/trusch/vibelang"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vibelang-core = { version = "0.4.0", default-features = false }
vibelang-rhai = { version = "0.4.0", default-features = false }
vibelang-dsp = { version = "0.4.0", features = ["wasm"] }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
uuid = { version = "1", features = ["js"] }
console_error_panic_hook = "0.1"

# Enable JavaScript random source for WASM
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.release]
# Optimize for small code size
opt-level = "s"
lto = true
