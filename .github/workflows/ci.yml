name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    # Informational only: the workspace currently has pre-existing clippy
    # findings, including deny-by-default `clippy::approx_constant` errors in
    # vibelang-dsp's build-script-generated code (generated.rs embeds literal
    # ~PI/2 constants from stdlib synthdef metadata), so a strict clippy run
    # cannot pass today. This step reports but does not fail the build.
    # Tighten to `-D warnings` once the generated-code lints are allowed at
    # the source and existing warnings are cleaned up.
    name: clippy (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        # - libasound2-dev: ALSA headers for midir (alsa-sys)
        # - libpipewire-0.3-dev + clang: pipewire-sys/libspa-sys bindgen;
        #   the pipewire-midi2 feature is part of vibelang-core's default
        #   "midi" feature, so it is built by default
        # - libjack-jackd2-dev: jack crate used by vibelang-keys
        # - libx11/xi/xtst + libxcb*: the x11 crate (via rdev) pulled in by the
        #   standalone vibe-keys terminal-MIDI-keyboard binary (vibelang-keys),
        #   which `cargo test --workspace` builds. The main `vibe` CLI no longer
        #   needs X11 since its TUI mode was removed.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libjack-jackd2-dev libpipewire-0.3-dev clang pkg-config \
            libx11-dev libxi-dev libxtst-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --workspace --all-targets

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        # Same rationale as the clippy job: ALSA for midir, PipeWire headers
        # for the default pipewire-midi2 feature, JACK + X11/XCB for the
        # standalone vibe-keys binary (vibelang-keys) built by --workspace.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libjack-jackd2-dev libpipewire-0.3-dev clang pkg-config \
            libx11-dev libxi-dev libxtst-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: Swatinem/rust-cache@v2
      - name: Run unit tests
        # Unit tests only. The workspace test suites use mock backends and do
        # not require a running scsynth or JACK/PipeWire server, so nothing
        # is excluded here. Audio-dependent end-to-end tests live in
        # tests/integration/run_tests.sh (needs scsynth + a sound server) and
        # are intentionally NOT run in CI.
        run: cargo test --workspace
