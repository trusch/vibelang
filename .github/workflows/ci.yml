name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    # Informational only: the workspace currently has pre-existing clippy
    # findings, including deny-by-default `clippy::approx_constant` errors in
    # vibelang-dsp's build-script-generated code (generated.rs embeds literal
    # ~PI/2 constants from stdlib synthdef metadata), so a strict clippy run
    # cannot pass today. This step reports but does not fail the build.
    # Tighten to `-D warnings` once the generated-code lints are allowed at
    # the source and existing warnings are cleaned up.
    name: clippy (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        # - libasound2-dev: ALSA headers for midir (alsa-sys)
        # - libpipewire-0.3-dev + clang: pipewire-sys/libspa-sys bindgen;
        #   the pipewire-midi2 feature is part of vibelang-core's default
        #   "midi" feature, so it is built by default
        # - libjack-jackd2-dev: jack crate used by vibelang-keys
        # - libx11/xi/xtst + libxcb*: the x11 crate (via rdev) pulled in by the
        #   standalone vibe-keys terminal-MIDI-keyboard binary (vibelang-keys),
        #   which `cargo test --workspace` builds. The main `vibe` CLI no longer
        #   needs X11 since its TUI mode was removed.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libjack-jackd2-dev libpipewire-0.3-dev clang pkg-config \
            libx11-dev libxi-dev libxtst-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --workspace --all-targets

  features:
    # Feature-combination gate.
    #
    # Every other job builds default features only, where Cargo's feature
    # unification hides two regression classes that break embedded and
    # cross-compiled builds while CI stays green:
    #
    #   1. A dependency edge that forgets `default-features = false` and
    #      silently re-enables an upstream default (fixed for the cli/lsp
    #      edges in #8).
    #   2. An optional native dependency creeping back into a feature that
    #      is supposed to be free of it — e.g. re-coupling PipeWire into
    #      `midi`, which #10 split apart.
    #
    # This job deliberately does NOT install libpipewire-0.3-dev. These
    # configurations must build on a machine with no PipeWire at all, so a
    # regression that pulls libspa/pipewire back in fails here at build
    # time instead of on someone's board. `cargo check` is enough: the
    # question is what enters the dependency graph, not runtime behaviour.
    name: features (${{ matrix.id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # MIDI without PipeWire — the embedded/cross target profile.
          - id: core-embedded
            args: -p vibelang-core --no-default-features --features native,midi
          # Core with no native dependencies at all.
          - id: core-minimal
            args: -p vibelang-core --no-default-features
          # The full embedded CLI, as cross-built for aarch64 boards.
          - id: cli-embedded
            args: -p vibelang-cli --no-default-features --features midi,api,lsp,extensions
          # No MIDI at all: neither ALSA nor PipeWire may be required.
          - id: cli-no-midi
            args: -p vibelang-cli --no-default-features --features api,lsp,extensions
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        # ALSA headers only (midir -> alsa-sys). PipeWire headers are
        # omitted on purpose — see the job comment above.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          key: features-${{ matrix.id }}
      - name: cargo check ${{ matrix.args }}
        run: cargo check ${{ matrix.args }}

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        # Same rationale as the clippy job: ALSA for midir, PipeWire headers
        # for the default pipewire-midi2 feature, JACK + X11/XCB for the
        # standalone vibe-keys binary (vibelang-keys) built by --workspace.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libjack-jackd2-dev libpipewire-0.3-dev clang pkg-config \
            libx11-dev libxi-dev libxtst-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/vibelang-wasm/package-lock.json
      - name: Check public artifact drift
        run: scripts/public-artifacts.sh check
      - name: Run unit tests
        # Unit tests only. The workspace test suites use mock backends and do
        # not require a running scsynth or JACK/PipeWire server, so nothing
        # is excluded here. Audio-dependent end-to-end tests live in
        # tests/integration/run_tests.sh (needs scsynth + a sound server) and
        # are intentionally NOT run in CI.
        run: cargo test --workspace
